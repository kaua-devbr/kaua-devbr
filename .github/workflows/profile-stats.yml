name: Atualizar estatísticas do perfil

on:
  schedule:
    - cron: '23 9 * * *'
  workflow_dispatch:
  push:
    paths:
      - update-stats.mjs
      - .github/workflows/profile-stats.yml

permissions:
  contents: write

concurrency:
  group: profile-stats
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - name: Gerar painel com dados públicos
        run: node update-stats.mjs
        env:
          GH_TOKEN: ${{ github.token }}
          PROFILE_USER: ${{ github.repository_owner }}
      - name: Salvar painel atualizado
        run: |
          if git diff --quiet -- stats.svg; then exit 0; fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add stats.svg
          git commit -m "docs: atualiza estatísticas do perfil"
          git push
